<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>สร้างบาร์โค้ดสินค้า — ShopBarcode</title>
  <meta name="description" content="ใส่ชื่อสินค้าและเลข Tracking ระบบจะสร้างบาร์โค้ด Code128 ให้อัตโนมัติ" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23111' d='M2 4h2v16H2zm3 0h1v16H5zm2 0h2v16H7zm3 0h1v16h-1zm2 0h3v16h-3zm4 0h1v16h-1zm2 0h2v16h-2zm3 0h1v16h-1z'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <div class="container">
      <header class="page-head">
        <h1>สร้างบาร์โค้ดสินค้า</h1>
        <p class="subtitle">ใส่ชื่อสินค้าและเลข Tracking ระบบจะสร้างบาร์โค้ด Code128 ให้อัตโนมัติ</p>
      </header>

      <section class="card form-card">
        <form id="add-form" class="add-row">
          <label class="field">
            <span class="label">ชื่อสินค้า</span>
            <input type="text" id="product-name" placeholder="เช่น เสื้อยืดสีขาว ไซส์ M" maxlength="120" required list="name-suggestions" autocomplete="off" />
            <datalist id="name-suggestions"></datalist>
          </label>

          <label class="field">
            <span class="label">เลข Tracking</span>
            <input type="text" id="tracking" placeholder="เช่น TH1234567890" maxlength="60" required autocapitalize="characters" autocorrect="off" spellcheck="false" />
            <small class="hint-text">แตะค้างเพื่อวาง — ระบบจะเพิ่มรายการให้อัตโนมัติ</small>
          </label>

          <div class="add-btn-wrap">
            <button type="submit" class="btn btn-primary">+ เพิ่มรายการ</button>
          </div>
        </form>
      </section>

      <div class="toolbar">
        <button id="print-btn" type="button" class="btn btn-success">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="6 9 6 2 18 2 18 9"></polyline>
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
            <rect x="6" y="14" width="12" height="8"></rect>
          </svg>
          พิมพ์
        </button>
        <button id="clear-btn" type="button" class="btn btn-outline-danger">ล้างทั้งหมด</button>
        <div id="sync-status" class="sync-status" title="สถานะการเชื่อมต่อ">
          <span class="sync-dot"></span>
          <span class="sync-text">กำลังเชื่อมต่อ…</span>
        </div>
      </div>

      <section class="card table-card">
        <div class="table-wrap">
          <table class="items-table">
            <thead>
              <tr>
                <th class="col-no">#</th>
                <th class="col-name">ชื่อสินค้า</th>
                <th class="col-status">สถานะ</th>
                <th class="col-barcode">BARCODE</th>
              </tr>
            </thead>
            <tbody id="items-body"></tbody>
          </table>
          <div id="empty-state" class="empty-state">ยังไม่มีรายการ — เพิ่มสินค้าด้านบนได้เลย</div>
        </div>
      </section>
    </div>
  </main>

  <div id="print-area" class="print-area" aria-hidden="true"></div>

  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
